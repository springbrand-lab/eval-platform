# Eval API and Run Worker on Eval SP's EC2 instance. The API joins Eval SP's compose network so
# that network's cloudflared connector can route evalapi.springbrand.ai to it as eval-platform-api:8788.
x-eval-runtime: &eval-runtime
  image: ${IMAGE_URI:?IMAGE_URI is required}
  restart: unless-stopped
  mem_limit: 1g
  volumes:
    - bundles:/data/bundles
    - ./rds-global-bundle.pem:/etc/ssl/certs/aws-rds-global-bundle.pem:ro

services:
  api:
    <<: *eval-runtime
    command: ["node", "dist/server.js"]
    environment:
      EVAL_API_HOST: 0.0.0.0
      EVAL_API_PORT: "8788"
      EVAL_BUNDLE_DIR: /data/bundles
    expose:
      - "8788"
    networks:
      default: {}
      eval-sp:
        aliases:
          - eval-platform-api
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8788/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?AWS_REGION is required}
        awslogs-group: /springbrand/eval-platform/production
        awslogs-stream: api

  run-worker:
    <<: *eval-runtime
    command: ["node", "dist/run-worker-main.js"]
    # Let in-progress Runs finish before the container is replaced.
    stop_grace_period: 5m
    environment:
      EVAL_BUNDLE_DIR: /data/bundles
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?AWS_REGION is required}
        awslogs-group: /springbrand/eval-platform/production
        awslogs-stream: run-worker

volumes:
  bundles: {}

networks:
  eval-sp:
    external: true
    name: eval_default
