packages:
  - apps/eval-api
  - apps/eval-web
  - apps/eval-cli
  - packages/*
  # sp-platform is a git submodule; EP consumes these SP packages from source
  # instead of waiting for published releases. Bump the submodule to update them.
  - vendor/sp-platform/packages/agent-contracts
  - vendor/sp-platform/packages/contracts
  - vendor/sp-platform/packages/eval-harness
  - vendor/sp-platform/packages/file-renderers
  - vendor/sp-platform/packages/morphy
  - vendor/sp-platform/packages/resource
  - vendor/sp-platform/packages/utils

allowBuilds:
  '@google/genai': false
  '@mongodb-js/zstd': false
  core-js-pure: false
  esbuild: true
  node-liblzma: false
  protobufjs: false
  workerd: true

# Our own published packages; they must not wait out the default release age.
minimumReleaseAgeExclude:
  - "@springbrand/agent-config-editor"
  - "@springbrand/agent-runtime"
  - '@springbrand/errors@0.1.0-alpha.4'
  - '@springbrand/http@0.1.0-alpha.8'

patchedDependencies:
  '@springbrand/agent-config-editor@0.1.0-alpha.4': patches/@springbrand__agent-config-editor@0.1.0-alpha.4.patch
