packages:
  - apps/eval-api
  - apps/eval-web
  - apps/eval-cli
  - packages/*

allowBuilds:
  esbuild: true
  workerd: true

# Our own packages, published from sp-platform's eval branch; they must not wait out the default release age.
minimumReleaseAgeExclude:
  - "@springbrand/eval-harness"
  - "@springbrand/file-renderers"
  - "@springbrand/contracts"
  - "@springbrand/agent-config-editor"

patchedDependencies:
  '@springbrand/agent-config-editor@0.1.0-alpha.0': patches/@springbrand__agent-config-editor@0.1.0-alpha.0.patch
