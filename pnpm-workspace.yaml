packages:
  - apps/eval-api
  - apps/eval-web
  - apps/eval-cli
  - packages/*

allowBuilds:
  '@google/genai': false
  '@mongodb-js/zstd': false
  core-js-pure: false
  esbuild: true
  node-liblzma: false
  protobufjs: false
  workerd: true

# Our own packages, published from sp-platform's eval branch; they must not wait out the default release age.
minimumReleaseAgeExclude:
  - "@springbrand/eval-harness"
  - "@springbrand/file-renderers"
  - "@springbrand/contracts"
  - "@springbrand/agent-config-editor"
  - "@springbrand/agent-runtime@0.3.1-alpha.15"

patchedDependencies:
  '@springbrand/agent-config-editor@0.1.0-alpha.3': patches/@springbrand__agent-config-editor@0.1.0-alpha.3.patch
