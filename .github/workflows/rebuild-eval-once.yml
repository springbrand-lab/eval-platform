name: Rebuild disposable Eval database once

on:
  workflow_dispatch:
    inputs:
      database:
        description: '确认重建的库名：eval-platform（仅联调数据；先备份）'
        required: true
        type: string
      image_tag:
        description: '已通过 CI 并推送 ECR 的完整 commit SHA'
        required: true
        type: string

permissions:
  contents: read

jobs:
  rebuild:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-api
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate the authorized target and release
        env:
          REBUILD_DATABASE: ${{ inputs.database }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          test "$REBUILD_DATABASE" = eval-platform
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$IMAGE_TAG" HEAD

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Verify the immutable image exists
        env:
          ECR_REPOSITORY: ${{ vars.AWS_ECR_REPOSITORY }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids "imageTag=$IMAGE_TAG" --query 'imageDetails[0].imageDigest'

      - name: Back up, rebuild, deploy and upload demonstration data
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.AWS_ECR_REPOSITORY }}
          INSTANCE_ID: ${{ vars.AWS_EC2_INSTANCE_ID }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          APP_SECRET_ID: eval-platform/api/production
          DB_SECRET_ID: eval-platform/database/production
          REBUILD_DATABASE: ${{ inputs.database }}
        run: bash infra/aws/deploy/dispatch.sh
