name: Test

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect affected projects
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.affected.outputs.api }}
      cli: ${{ steps.affected.outputs.cli }}
      web: ${{ steps.affected.outputs.web }}
      packages: ${{ steps.affected.outputs.packages }}
      any: ${{ steps.affected.outputs.any }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Test affected-project detection
        run: node --test scripts/affected-projects.test.mjs

      - id: affected
        name: Detect affected projects
        uses: ./.github/actions/detect-affected
        with:
          base-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head-sha: ${{ github.sha }}
          force-all: ${{ github.event_name == 'workflow_dispatch' }}

  packages:
    name: Test shared packages
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare tests
        uses: ./.github/actions/prepare-workspace
        with:
          package-filter: "{packages/**}"
          cache-scope: packages

      - name: Restore Vitest cache
        uses: actions/cache@v6
        with:
          path: |
            packages/*/node_modules/.vite/vitest
          key: vitest-${{ runner.os }}-node-${{ hashFiles('.node-version') }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            vitest-${{ runner.os }}-node-${{ hashFiles('.node-version') }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Check shared packages
        run: pnpm -r --if-present --filter './packages/**' check

      - name: Test shared packages
        run: pnpm -r --if-present --filter './packages/**' test

  api:
    name: Test Eval API
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # eval-api links @springbrand/eval-harness from a sibling sp-platform checkout
      # (docs/sp-package-publishing-todo.md). sp-platform is private, so this needs a
      # read-only token; actions/checkout only writes inside the workspace, hence the move.
      - name: Require sp-platform read token
        env:
          SP_PLATFORM_TOKEN: ${{ secrets.SP_PLATFORM_TOKEN }}
        run: |
          if [[ -z "$SP_PLATFORM_TOKEN" ]]; then
            echo "::error::Add the SP_PLATFORM_TOKEN secret (Contents: read on springbrand-lab/sp-platform) to check out eval-harness."
            exit 1
          fi

      - name: Checkout sp-platform
        uses: actions/checkout@v6
        with:
          repository: springbrand-lab/sp-platform
          ref: eval
          path: .sp-platform
          token: ${{ secrets.SP_PLATFORM_TOKEN }}
          persist-credentials: false

      - name: Place sp-platform next to the repository
        run: mv .sp-platform ../sp-platform

      - name: Prepare tests
        uses: ./.github/actions/prepare-workspace
        with:
          package-filter: "@eval-platform/eval-api"
          cache-scope: api

      - name: Install eval-harness dependencies
        working-directory: ../sp-platform
        run: pnpm --filter @springbrand/eval-harness install --frozen-lockfile --prod

      - name: Restore Vitest cache
        uses: actions/cache@v6
        with:
          path: |
            apps/eval-api/node_modules/.vite/vitest
          key: vitest-${{ runner.os }}-node-${{ hashFiles('.node-version') }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            vitest-${{ runner.os }}-node-${{ hashFiles('.node-version') }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Check Eval API
        run: pnpm --filter @eval-platform/eval-api check

      - name: Test Eval API
        run: pnpm --filter @eval-platform/eval-api test

  cli:
    name: Test Eval CLI
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare tests
        uses: ./.github/actions/prepare-workspace
        with:
          package-filter: "@eval-platform/eval-cli"
          cache-scope: cli

      - name: Restore Vitest cache
        uses: actions/cache@v6
        with:
          path: |
            apps/eval-cli/node_modules/.vite/vitest
          key: vitest-${{ runner.os }}-node-${{ hashFiles('.node-version') }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            vitest-${{ runner.os }}-node-${{ hashFiles('.node-version') }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Check Eval CLI
        run: pnpm --filter @eval-platform/eval-cli check

      - name: Test Eval CLI
        run: pnpm --filter @eval-platform/eval-cli test

  web:
    name: Test Eval Web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare tests
        uses: ./.github/actions/prepare-workspace
        with:
          package-filter: "@eval-platform/eval-web"
          cache-scope: web

      - name: Restore Vitest cache
        uses: actions/cache@v6
        with:
          path: |
            apps/eval-web/node_modules/.vite/vitest
          key: vitest-${{ runner.os }}-node-${{ hashFiles('.node-version') }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            vitest-${{ runner.os }}-node-${{ hashFiles('.node-version') }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Check Eval Web
        run: pnpm --filter @eval-platform/eval-web check

      - name: Test Eval Web
        run: pnpm --filter @eval-platform/eval-web test
