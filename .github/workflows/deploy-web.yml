name: Deploy Eval Web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - apps/eval-web/**
      - packages/eval-contracts/**
      - pnpm-lock.yaml
      - .github/workflows/deploy-web.yml

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Eval Web to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://evalrapp.springbrand.ai
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare workspace
        uses: ./.github/actions/prepare-workspace
        with:
          package-filter: "@eval-platform/eval-web"
          cache-scope: deploy-web

      - name: Check Eval Web
        run: pnpm --filter @eval-platform/eval-web check

      - name: Build Eval Web
        run: pnpm --filter @eval-platform/eval-web build

      - name: Deploy Worker
        working-directory: apps/eval-web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
