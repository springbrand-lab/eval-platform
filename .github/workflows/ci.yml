name: CI

# One pipeline: detect affected projects, test them, then deploy what changed.
# Deploys run only on main after their affected tests pass.
# Web waits for a changed API to deploy successfully.
on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

# A newer push cancels stale test runs on PRs, but never interrupts a deploy on main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect affected projects
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.affected.outputs.api }}
      cli: ${{ steps.affected.outputs.cli }}
      web: ${{ steps.affected.outputs.web }}
      packages: ${{ steps.affected.outputs.packages }}
      any: ${{ steps.affected.outputs.any }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Test affected-project detection
        run: node --test scripts/affected-projects.test.mjs

      - id: affected
        name: Detect affected projects
        uses: ./.github/actions/detect-affected
        with:
          base-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head-sha: ${{ github.sha }}
          force-all: ${{ github.event_name == 'workflow_dispatch' }}

  packages:
    name: Test shared packages
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare tests
        uses: ./.github/actions/prepare-workspace
        with:
          package-filter: "{packages/**}"
          cache-scope: packages

      - name: Restore Vitest cache
        uses: actions/cache@v6
        with:
          path: |
            packages/*/node_modules/.vite/vitest
          key: vitest-${{ runner.os }}-node-${{ hashFiles('.node-version') }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            vitest-${{ runner.os }}-node-${{ hashFiles('.node-version') }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Check shared packages
        run: pnpm -r --if-present --filter './packages/**' check

      - name: Test shared packages
        run: pnpm -r --if-present --filter './packages/**' test

  api:
    name: Test Eval API
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: eval_test
          POSTGRES_PASSWORD: eval_test
          POSTGRES_DB: postgres
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U eval_test -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://eval_test:eval_test@127.0.0.1:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare tests
        uses: ./.github/actions/prepare-workspace
        with:
          package-filter: "@eval-platform/eval-api"
          cache-scope: api

      - name: Restore Vitest cache
        uses: actions/cache@v6
        with:
          path: |
            apps/eval-api/node_modules/.vite/vitest
          key: vitest-${{ runner.os }}-node-${{ hashFiles('.node-version') }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            vitest-${{ runner.os }}-node-${{ hashFiles('.node-version') }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Check Eval API
        run: pnpm --filter @eval-platform/eval-api check

      - name: Test Eval API
        run: |
          : "${DATABASE_URL:?DATABASE_URL is required for CI PostgreSQL tests}"
          EVAL_IMPORT_TEST_DATABASE_URL="$DATABASE_URL" pnpm --filter @eval-platform/eval-api test

      - name: Test deployment scripts
        run: pnpm test:deployment

  cli:
    name: Test Eval CLI
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare tests
        uses: ./.github/actions/prepare-workspace
        with:
          package-filter: "@eval-platform/eval-cli"
          cache-scope: cli

      - name: Restore Vitest cache
        uses: actions/cache@v6
        with:
          path: |
            apps/eval-cli/node_modules/.vite/vitest
          key: vitest-${{ runner.os }}-node-${{ hashFiles('.node-version') }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            vitest-${{ runner.os }}-node-${{ hashFiles('.node-version') }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Check Eval CLI
        run: pnpm --filter @eval-platform/eval-cli check

      - name: Test Eval CLI
        run: pnpm --filter @eval-platform/eval-cli test

  web:
    name: Test Eval Web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare tests
        uses: ./.github/actions/prepare-workspace
        with:
          package-filter: "@eval-platform/eval-web"
          cache-scope: web

      - name: Restore Vitest cache
        uses: actions/cache@v6
        with:
          path: |
            apps/eval-web/node_modules/.vite/vitest
          key: vitest-${{ runner.os }}-node-${{ hashFiles('.node-version') }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            vitest-${{ runner.os }}-node-${{ hashFiles('.node-version') }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Check Eval Web
        run: pnpm --filter @eval-platform/eval-web check

      - name: Test Eval Web
        run: pnpm --filter @eval-platform/eval-web test

  deploy-api:
    name: Deploy Eval API and Run Worker
    needs: [changes, packages, api]
    if: >-
      !cancelled()
      && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      && needs.changes.outputs.api == 'true'
      && needs.api.result == 'success'
      && (needs.packages.result == 'success' || needs.packages.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-api
      cancel-in-progress: false
    # No environment: the AWS role trusts this repository's main-branch OIDC subject.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate deployment configuration
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REPOSITORY: ${{ vars.AWS_ECR_REPOSITORY }}
          INSTANCE_ID: ${{ vars.AWS_EC2_INSTANCE_ID }}
        run: |
          : "${AWS_ROLE_ARN:?AWS_ROLE_ARN is required}"
          : "${AWS_REGION:?AWS_REGION is required}"
          : "${ECR_REPOSITORY:?AWS_ECR_REPOSITORY is required}"
          : "${INSTANCE_ID:?AWS_EC2_INSTANCE_ID is required}"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Check for an existing immutable image
        id: image
        env:
          ECR_REPOSITORY: ${{ vars.AWS_ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids "imageTag=$IMAGE_TAG" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.image.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        if: steps.image.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/eval-api/Dockerfile
          target: production
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.AWS_ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha,scope=eval-api
          cache-to: type=gha,scope=eval-api,mode=max

      - name: Migrate and deploy through Systems Manager
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.AWS_ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
          INSTANCE_ID: ${{ vars.AWS_EC2_INSTANCE_ID }}
          APP_SECRET_ID: eval-platform/api/production
          DB_SECRET_ID: eval-platform/database/production
        run: bash infra/aws/deploy/dispatch.sh

      - name: Smoke test
        env:
          API_ORIGIN: https://evalapi.springbrand.ai
        run: |
          curl --fail --show-error --silent --retry 12 --retry-delay 5 --retry-all-errors "$API_ORIGIN/healthz"
          # Without the eval-web token every /api route is rejected.
          test "$(curl --show-error --silent --output /dev/null --write-out '%{http_code}' "$API_ORIGIN/api/me")" = 401

  deploy-web:
    name: Deploy Eval Web to Cloudflare
    needs: [changes, packages, web, deploy-api]
    if: >-
      !cancelled()
      && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      && needs.changes.outputs.web == 'true'
      && needs.web.result == 'success'
      && (needs.packages.result == 'success' || needs.packages.result == 'skipped')
      && (needs.changes.outputs.api != 'true' || needs.deploy-api.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-web
      cancel-in-progress: false
    environment:
      name: production
      url: https://evalrapp.springbrand.ai
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare workspace
        uses: ./.github/actions/prepare-workspace
        with:
          package-filter: "@eval-platform/eval-web"
          cache-scope: deploy-web

      - name: Build Eval Web
        run: pnpm --filter @eval-platform/eval-web build

      - name: Deploy Worker
        working-directory: apps/eval-web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
