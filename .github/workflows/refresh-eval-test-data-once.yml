name: Refresh disposable Eval test inputs once

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Authorized scope: all-test-data-authorized'
        required: true
        type: string
      image_tag:
        description: 'Expected currently deployed Eval API/Worker image commit'
        required: true
        type: string
      verify_backup:
        description: 'Optional completed backup path: verify the existing refresh without deleting or uploading again'
        required: false
        type: string

permissions:
  contents: read

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-api
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Validate the authorized target
        env:
          REFRESH_TARGET: ${{ inputs.target }}
          EXPECTED_IMAGE_TAG: ${{ inputs.image_tag }}
          VERIFY_BACKUP: ${{ inputs.verify_backup }}
        run: |
          test "$REFRESH_TARGET" = all-test-data-authorized
          [[ "$EXPECTED_IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Back up, refresh and verify through Systems Manager
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          INSTANCE_ID: ${{ vars.AWS_EC2_INSTANCE_ID }}
          EXPECTED_IMAGE_TAG: ${{ inputs.image_tag }}
          VERIFY_BACKUP: ${{ inputs.verify_backup }}
        shell: bash
        run: |
          set -Eeuo pipefail
          payload="$(tar -czf - fixtures/eval-demo/seed.mjs infra/aws/ops | base64 -w0)"
          remote_dir="/opt/eval-platform/production/test-refresh-$GITHUB_RUN_ID"
          parameters="$(jq -nc --arg payload "$payload" --arg dir "$remote_dir" --arg id "$GITHUB_RUN_ID" --arg image "$EXPECTED_IMAGE_TAG" --arg backup "$VERIFY_BACKUP" '{executionTimeout:["900"], commands:[
            ("install -d -m 0700 " + ($dir|@sh)),
            ("printf %s " + ($payload|@sh) + " | base64 -d | tar -xzf - -C " + ($dir|@sh)),
            ("EVAL_TEST_DATA_REFRESH=all-test-data-authorized REFRESH_RUN_ID=" + ($id|@sh) + " EXPECTED_IMAGE_TAG=" + ($image|@sh) + " VERIFY_BACKUP=" + ($backup|@sh) + " bash " + ($dir|@sh) + "/infra/aws/ops/refresh-test-data.sh")
          ]}')"
          command_id="$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript --comment "Authorized refresh of disposable Eval inputs $GITHUB_RUN_ID" --parameters "$parameters" --query Command.CommandId --output text)"
          for ((attempt=0; attempt<180; attempt++)); do
            status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)"
            case "$status" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 5
          done
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}' --output json
          test "$status" = Success
